<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Self-hosted fonts (@font-face in src/styles/base.css). Preload the above-the-fold faces —
       the wordmark and first-screen body (Latin + Cyrillic, the audience is bilingual) — so the
       hero never flashes a system fallback. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/clash-display.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/onest-latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/onest-cyrillic.woff2" crossorigin />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#212842" />
  <meta
    name="description"
    content="84softworks – an engineering studio building reliable B2B AI, founded by Andrei Baranov."
  />
  <link rel="canonical" href="https://84softworks.com/" />

  <!-- Favicons / app icons. One round icon everywhere (no per-browser JS): a navy disc inside a
       bright orange ring, transparent corners. The orange ring lifts the icon's contrast so Safari
       (16.4+) doesn't paint its white "low-contrast" card behind the dark navy mark — the reason a
       plain navy icon showed a white box in Safari only. favicon.ico is BMP/DIB-encoded (16/32/48),
       NOT PNG-in-ICO, which Safari's ICO decoder can't read. The 96×96 PNG is what Google Search
       picks up (Google wants a favicon larger than 48px; the 16/32 were too small → generic globe).
       apple-touch stays an opaque square that iOS masks to a squircle (transparent corners would
       fill black there). ?v= busts Safari/Firefox's very sticky favicon cache when the art changes –
       bump it on the next icon edit. -->
  <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="84softworks" />
  <meta property="og:title" content="84softworks" />
  <meta property="og:description" content="Engineering studio building reliable B2B AI." />
  <meta property="og:url" content="https://84softworks.com/" />
  <meta property="og:image" content="https://84softworks.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="84softworks – engineering studio building reliable B2B AI" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="ru_RU" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="84softworks" />
  <meta name="twitter:description" content="Engineering studio building reliable B2B AI." />
  <meta name="twitter:image" content="https://84softworks.com/og-image.png" />

  <!-- Structured data. WebSite.name is the primary signal Google uses to render the site-name line
       above the title in search results; without it Google falls back to the bare domain
       ("84softworks.com") even though og:site_name / title already say "84softworks". Organization
       reinforces the brand + logo association for the knowledge panel. Domain-level and cached —
       updates only on re-crawl, not instantly. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "84softworks",
      "url": "https://84softworks.com/"
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "84softworks",
      "url": "https://84softworks.com/",
      "logo": "https://84softworks.com/favicon-96x96.png"
    }
  </script>

  <title>84softworks · Reliable B2B software</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
